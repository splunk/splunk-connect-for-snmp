{{- if and .Values.mongodb.auth.enabled (eq .Values.mongodb.mode "replication") }}
{{- $secretName := printf "%s-mongodb-replicakey" .Release.Name }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $replicaKey := "" }}
{{- if $existingSecret }}
{{- $invalidSecretMessage := printf "existing MongoDB replica-key Secret %s/%s must contain a non-empty data.replica-key value" .Release.Namespace $secretName }}
{{- $replicaKey = dig "data" "replica-key" "" $existingSecret | required $invalidSecretMessage }}
{{- else }}
{{- $replicaKey = randAlphaNum 64 | b64enc }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app: {{ .Release.Name }}-mongodb
type: Opaque
data:
  replica-key: {{ $replicaKey | quote }}
{{- end }}