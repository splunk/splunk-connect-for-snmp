{{ if .Values.UI.enable }}
apiVersion: v1
kind: Service
metadata:
  name: ui-backend-entrypoint
spec:
  selector:
    app: ui-backend
  type: {{ .Values.UI.backEnd.serviceType | default "ClusterIP" }}
  ports:
  - port: 5000
    targetPort: 5000
    {{- if eq (.Values.UI.backEnd.serviceType | default "ClusterIP") "NodePort" }}
    nodePort: {{ .Values.UI.backEnd.NodePort }}
    {{- end }}
{{- end }}
