[pytest]
asyncio_mode = strict  
asyncio_debug = true
markers =
    part1: marks tests as belonging to part 1 of a test suite
    part2: marks tests as belonging to part 2 of a test suite
    part3: marks tests as belonging to part 3 of a test suite
    part4: marks tests as belonging to part 4 of a test suite
    part5: marks tests as belonging to part 5 of a test suite
    part6: marks tests as belonging to part 6 of a test suite
    part7: marks tests as belonging to part 7 of a test suite
    part8: marks tests as belonging to part 8 of a test suite
    part9: initial timing recurrence ingestion restarts and overlapping registration
    part10: groups and CSV profile assignment lifecycle
    part11: long interval boundaries and profile frequency changes
    part12: authenticated Redis and MongoDB failover
    part13: jitter enable disable window changes and re-enable
    part14: inventory reload payload protocol and configuration source changes
    part15: WALK scope and smart base mandatory conditional profiles
    part16: urgent delayed requests and missing schedule recovery
    long_interval: scenarios requiring a long scheduling interval
    mongo_inventory: source switching with authenticated UI configuration

addopts = -s -rfps --durations=10 --disable-pytest-warnings --continue-on-collection-errors

# Keep these to ensure pytest's internal logging system is also active
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
